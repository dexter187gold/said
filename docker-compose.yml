services:
  said:
    build: .
    ports:
      - "8787:8787"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production-use-long-random}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - DATABASE_PATH=/app/server/data/said.db
    volumes:
      - said-data:/app/server/data
    restart: unless-stopped

volumes:
  said-data:
